# Set these to your desired migration target.
target:
  language: Go
  version: '1.24'
  # framework: Gin

# Maximum simultaneously active migration workers
agents:
  workers: 3
  maxRetries: 3

# Required build/test commands for evaluation. Go projects need a coherent
# package layout and module setup; override these for your actual project.
evaluation:
  build: [go, build, ./...]
  test: [go, test, ./...]
  timeoutSeconds: 60

orchestration:
  maxRounds: 2
