[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hensei"
version = "0.1.0"
description = "Dependency-aware multi-agent code migration research harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hensei = "hensei.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
